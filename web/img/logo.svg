<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PENDEL">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <radialGradient id="bob" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffe4f1"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pg)"/>
  <!-- pendulum: pivot, rod and bob swinging through a beat -->
  <path d="M14 40 A22 22 0 0 0 50 40" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/>
  <circle cx="32" cy="12" r="3" fill="#fff"/>
  <path d="M32 12 L41 39" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="42.5" cy="43.5" r="8" fill="url(#bob)"/>
  <!-- beat pulse inside the bob -->
  <path d="M37.5 43.5h2.2l1.4-3 2 6 1.4-3h2" fill="none" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
